/* ==================== 房主连接管理 ==================== */
function onHostConnection(conn){
  conn.on('open', function(){ state.conns.set(conn.peer, conn); });
  conn.on('data', function(data){ handleHostData(conn, data); });
  conn.on('close', function(){
    if(conn.__replaced){ return; }
    var nick=state.members.get(conn.peer);
    state.conns['delete'](conn.peer);
    state.members['delete'](conn.peer);
    var call=state.mediaCalls.get(conn.peer);
    if(call){ try{call.close();}catch(e){} state.mediaCalls['delete'](conn.peer); }
    state.identityToPeer.forEach(function(p,id){ if(p===conn.peer) state.identityToPeer.delete(id); });
    if(nick){ addSystem(nick+' 离开了房间'); broadcast({type:'system', text:nick+' 离开了房间'}); }
    broadcast({type:'members', members:memberList()});
    renderMembers();
  });
}
function handleHostData(conn, data){
  if(!data||typeof data!=='object') return;
  if(data.type==='ping'){ try{ if(conn.open) conn.send({type:'pong', ts:data.ts}); }catch(e){} return; }
  if(data.type==='pong') return;
  if(data.type==='media-start'){ onMediaStart(data); return; }
  if(data.type==='media-chunk'){ onMediaChunk(data); return; }
  if(data.type==='media-end'){ onMediaEnd(data); return; }
  if(data.type==='client-history'){
    var msgs = data.messages || [];
    var added = mergeRemoteHistory(msgs);
    if(added.length) broadcastMergedHistory(added, conn.peer);
    return;
  }
  if(data.type==='client-history-end'){ return; }
  if(data.type==='hello'){
    var nick = String(data.nick||'匿名').slice(0,12);
    var identityId = String(data.identityId||'').slice(0,64);

    if(identityId){
      var oldPeer = state.identityToPeer.get(identityId);
      if(oldPeer && oldPeer !== conn.peer){
        state.replacedPeers.add(oldPeer);
        var oldConn = state.conns.get(oldPeer);
        if(oldConn){ try{ oldConn.__replaced = true; oldConn.close(); }catch(e){} }
        state.conns.delete(oldPeer);
        state.members.delete(oldPeer);
        var oldCall = state.mediaCalls.get(oldPeer);
        if(oldCall){ try{ oldCall.close(); }catch(e){} }
        state.mediaCalls.delete(oldPeer);
      }
      state.identityToPeer.set(identityId, conn.peer);
    }

    var seenKey = identityId ? ('__seen_'+identityId) : null;
    var isKnown = false;
    if(seenKey){
      if(state[seenKey]) isKnown = true;
      else state[seenKey] = true;
    }

    state.members.set(conn.peer, nick);
    safeSend(conn, {
      type:'welcome',
      url:state.url,
      roomId:state.roomId,
      hostNick:state.nick,
      members:memberList(),
      shareActive:state.shareActive,
      shareKind:state.shareKind
    });
    setTimeout(function(){ sendHistoryTo(conn); }, 120);
    setTimeout(function(){ safeSend(conn, { type:'ask-client-history' }); }, 380);
    if(state.shareActive && state.shareStream){
      setTimeout(function(){ callPeerWithStream(conn.peer); }, 400);
      setTimeout(function(){ callPeerWithStream(conn.peer); }, 1200);
    }
    addSystem(nick + (isKnown ? ' 重新连接了房间' : ' 加入了房间'));
    broadcast({type:'system', text:nick + (isKnown ? ' 重新连接了房间' : ' 加入了房间')}, conn.peer);
    broadcast({type:'members', members:memberList()});
    renderMembers();
    saveSession();
    return;
  }
  if(data.type==='chat'){
    var sNick=state.members.get(conn.peer)||'匿名';
    var text=String(data.text==null?'':data.text).slice(0,2000).trim();
    if(!text) return;
    var ts=Date.now();
    var mid=data.id||makeMsgId();
    broadcast({type:'chat', id:mid, nick:sNick, text:text, ts:ts, term:data.term||null}, conn.peer);
    handleChatDisplay(sNick, text, ts, data.term||null, false, mid);
    if(data.term && data.term.query){
      setTimeout(function(){ triggerHostTermQuery(mid); }, 80);
    }
    return;
  }
  if(data.type==='share-request'){ if(state.shareActive&&state.shareStream) callPeerWithStream(conn.peer); return; }
  if(data.type==='url-request'){ safeSend(conn, {type:'url', url:state.url||'', by:'host'}); return; }
}
function handleGuestData(data){
  if(!data||typeof data!=='object') return;
  if(data.type==='ping'){ if(state.hostConn&&state.hostConn.open){ try{ state.hostConn.send({type:'pong', ts:data.ts}); }catch(e){} } return; }
  if(data.type==='pong') return;
  if(data.type==='media-start'){ onMediaStart(data); return; }
  if(data.type==='media-chunk'){ onMediaChunk(data); return; }
  if(data.type==='media-end'){ onMediaEnd(data); return; }
  if(data.type==='history'){ mergeRemoteHistory(data.messages||[]); return; }
  if(data.type==='history-merge'){ mergeRemoteHistory(data.messages||[]); return; }
  if(data.type==='ask-client-history'){ sendLocalHistoryToHost(); return; }
  if(data.type==='term-result'){
    var m=null;
    for(var i=0;i<allMessages.length;i++){
      if(allMessages[i].id===data.msgId){ m=allMessages[i]; break; }
    }
    if(m && m.term){
      m.term.loaded=true;
      m.term.loading=false;
      m.term.awaitingHost=false;
      m.term.candidates=data.candidates||[];
      m.term.source=data.source||null;
      m.term.errKind=data.errKind||null;

      if(m.term.candidates.length===1) m.term.data=m.term.candidates[0];
      pushMessage(m);
    }

  }
  if(data.type==='chat'){ handleChatDisplay(data.nick||'匿名', String(data.text||''), data.ts, data.term||null, false, data.id||null); }
  else if(data.type==='system'){ addSystem(String(data.text||'')); }
  else if(data.type==='members'){ state.members=new Map((data.members||[]).map(function(m){ return [m.id,m.nick]; })); renderMembers(); }

    var u=String(data.url||'');

  }
  else if(data.type==='share-start'){
    state.shareActive=true;
    state.shareKind=data.kind||'screen';
    var b=$('#shareBadge'); if(b) b.classList.remove('hidden');
    var bt=$('#shareBadgeText'); if(bt) bt.textContent=(state.shareKind==='camera')?'房主共享摄像头中':'房主共享中';
    addSystem(state.shareKind==='camera'?'📡 房主开启了摄像头共享':'📡 房主开启了共享屏幕');
    if(state.hostConn&&state.hostConn.open) safeSend(state.hostConn, {type:'share-request'});
  }
  else if(data.type==='share-stop'){

function scheduleReconnectTick(delay){

function attemptReconnect(){
  reconnectTimer=null;

function callPeerWithStream(peerId){
  if(!state.shareStream||!state.peer) return;
  var old=state.mediaCalls.get(peerId);
  if(old){ try{old.close();}catch(e){} state.mediaCalls['delete'](peerId); }
  try{
    var call=state.peer.call(peerId, state.shareStream);
    state.mediaCalls.set(peerId, call);
    try{
      var pc=call.peerConnection;
      if(pc){
        var senders=pc.getSenders?pc.getSenders():[];
        for(var si=0;si<senders.length;si++){
          var s=senders[si];
          if(s && s.track && s.track.kind==='video'){
            var p=s.getParameters();
            p.encodings = p.encodings && p.encodings.length ? p.encodings : [{}];
            p.encodings[0].maxBitrate = 1500000;
            p.encodings[0].maxFramerate = 24;
            try{ s.setParameters(p)['catch'](function(){}); }catch(e2){}
          }
        }
      }
    }catch(e){}
    call.on('close', function(){ state.mediaCalls['delete'](peerId); });
    call.on('error', function(){ state.mediaCalls['delete'](peerId); });
  }catch(e){}
}
function startShare(){
  if(state.shareActive){ stopShare(); return; }

  if(!env.isSecure){ toast('当前环境不允许抓取画面（请用 https 或本地文件打开）'); return; }
  if(env.canShareScreen){ shareScreenFlow(); return; }

}
function shareScreenFlow(){
  toast('请在弹窗里选择要共享的屏幕、窗口或标签页…');
  getDisplayMediaCompat(function(err, s){
    if(s&&streamHasVideo(s)){ beginShare(s, 'screen'); return; }
    if(err&&(err.name==='NotAllowedError'||err.name==='PermissionDeniedError')){ toast('已取消共享'); return; }
    if(env.canShareCamera){ toast('屏幕共享不可用，改为共享摄像头'); shareCameraFlow(); return; }
    toast('共享失败：'+mediaErrText(err));

function shareCameraFlow(){
  var facing=state.shareFacing||'user';
  getUserMediaCompat({video:{facingMode:facing, width:{ideal:1280,max:1280}, height:{ideal:720,max:720}, frameRate:{ideal:24,max:24}}, audio:true}, function(err, s){
    if(s&&streamHasVideo(s)){ beginShare(s, 'camera'); return; }
    getUserMediaCompat({video:true, audio:false}, function(err2, s2){
      if(s2&&streamHasVideo(s2)){ beginShare(s2, 'camera'); return; }
      var e=err2||err;
      var n=(e&&e.name)||'';
      if(n==='NotAllowedError'||n==='PermissionDeniedError') toast('已取消共享（摄像头权限被拒绝）');
      else toast('共享摄像头失败：'+mediaErrText(e));

function beginShare(s, kind){

  }

function switchCameraFacing(){

/* ==================== 图片/语音 ==================== */
function compressImage(file, cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height;
      if(w>MAX_IMG_DIM||h>MAX_IMG_DIM){
        if(w>h){ h=Math.round(h*MAX_IMG_DIM/w); w=MAX_IMG_DIM; }
        else { w=Math.round(w*MAX_IMG_DIM/h); h=MAX_IMG_DIM; }
      }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      var ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      var d;
      try{ d=c.toDataURL('image/jpeg', IMG_QUALITY); }catch(e){ d=r.result; }
      cb(d,w,h);
    };
    img.onerror=function(){ toast('图片读取失败'); };
    img.src=r.result;
  };
  r.onerror=function(){ toast('图片读取失败'); };
  r.readAsDataURL(file);
}
function sendMediaToRoom(dataUrl, kind, meta, sendFn){
  var id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  var total=Math.ceil(dataUrl.length/CHUNK_SIZE);
  sendFn({type:'media-start', id:id, kind:kind, total:total, meta:meta||{}});
  var idx=0;
  function nx(){
    if(idx>=total){ sendFn({type:'media-end', id:id}); return; }
    var ch=dataUrl.substr(idx*CHUNK_SIZE, CHUNK_SIZE);
    sendFn({type:'media-chunk', id:id, idx:idx, data:ch});
    idx++;
    setTimeout(nx, MEDIA_SEND_INTERVAL);
  }
  nx();
}
function onMediaStart(d){ pendingMedia.set(d.id, {kind:d.kind, total:d.total, meta:d.meta||{}, chunks:new Array(d.total), received:0, ts:Date.now()}); }
function onMediaChunk(d){ var m=pendingMedia.get(d.id); if(!m) return; if(m.chunks[d.idx]===undefined){ m.chunks[d.idx]=d.data; m.received++; } }
function onMediaEnd(d){ var m=pendingMedia.get(d.id); if(!m) return; if(m.received<m.total) return; pendingMedia['delete'](d.id); var full=m.chunks.join(''); handleCompleteMedia(full, m.kind, m.meta, false); }
function handleCompleteMedia(d, k, meta, self){
  if(k==='image') pushMessage({kind:'image', nick:meta.nick, ts:meta.ts, dataUrl:d, self:!!self});
  else if(k==='audio') pushMessage({kind:'audio', nick:meta.nick, ts:meta.ts, dataUrl:d, meta:meta, self:!!self});
  if(!self) noteUnread();
}
function onImagePicked(e){
  var f=e.target&&e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('请选择图片'); return; }
  if(Date.now()-__lastMediaSend<MEDIA_SEND_COOLDOWN){ toast('图片发送太频繁，稍等一下'); return; }
  __lastMediaSend=Date.now();
  toast('正在压缩图片…');
  compressImage(f, function(d,w,h){
    if(Math.round(d.length*0.75)>MAX_MEDIA_BYTES){ toast('图片太大，请压缩后再发'); return; }
    var ts=Date.now(), meta={nick:state.nick, ts:ts, w:w, h:h};
    handleCompleteMedia(d, 'image', meta, true);
    sendMediaToRoom(d, 'image', meta, sendToRoom);
  });
}
var recorder=null, recStream=null, recChunks=[], recStartTs=0, recTimer=null, recDuration=0, recCancelled=false;
function startRecording(){
  if(recorder) return;
  if(!env.hasUserMedia||!env.hasMediaRecorder){ toast('当前环境不支持录音'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    recStream=s; recChunks=[]; recCancelled=false; recDuration=0;
    var mime='';
    try{
      var cands=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'];
      for(var i=0;i<cands.length;i++){
        if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(cands[i])){ mime=cands[i]; break; }
      }
      recorder=mime?new MediaRecorder(s,{mimeType:mime}):new MediaRecorder(s);
    }catch(e){
      try{ recorder=new MediaRecorder(s); }
      catch(e2){ toast('录音初始化失败'); try{s.getTracks().forEach(function(t){t.stop();});}catch(e3){} recStream=null; return; }
    }
    recorder.ondataavailable=function(ev){ if(ev.data&&ev.data.size>0) recChunks.push(ev.data); };
    recorder.onstop=function(){
      var dur=recDuration, mimeType=recorder.mimeType||'audio/webm';
      cleanupRecorder();
      if(recCancelled) return;
      var blob;
      try{ blob=new Blob(recChunks, {type:mimeType}); }catch(e){ toast('录音合成失败'); return; }
      if(blob.size===0){ toast('录音为空，请重试'); return; }
      if(blob.size>1.5*1024*1024){ toast('录音太长，请缩短'); return; }
      var fr=new FileReader();
      fr.onload=function(){
        var ts=Date.now(), meta={nick:state.nick, ts:ts, duration:dur, mime:mimeType};
        handleCompleteMedia(fr.result, 'audio', meta, true);
        sendMediaToRoom(fr.result, 'audio', meta, sendToRoom);
      };
      fr.readAsDataURL(blob);
    };
    recStartTs=Date.now();
    try{ recorder.start(500); }catch(e){ recorder.start(); }
    var rb=$('#recordingBar'); if(rb) rb.classList.remove('hidden');
    var mb=$('#micBtn'); if(mb) mb.classList.add('active');
    updateRecTime();
    recTimer=setInterval(updateRecTime, 200);
  }, function(err){
    if(err&&(err.name==='NotAllowedError'||err.name==='PermissionDeniedError')) toast('麦克风权限被拒绝');
    else toast('无法录音：'+(err&&err.message||'未知错误'));
  });
}
function updateRecTime(){
  if(!recorder||recorder.state!=='recording') return;
  recDuration=(Date.now()-recStartTs)/1000;
  var t=$('#recTime');
  if(t){ var s=Math.floor(recDuration); t.textContent=Math.floor(s/60)+':'+pad2(s%60); }
  if(recDuration>=REC_MAX_DURATION/1000) stopRecording(true);
}
function stopRecording(send){ if(!recorder) return; recCancelled=!send; try{ recorder.stop(); }catch(e){} }
function cleanupRecorder(){
  if(recTimer){ clearInterval(recTimer); recTimer=null; }
  var rb=$('#recordingBar'); if(rb) rb.classList.add('hidden');
  var mb=$('#micBtn'); if(mb) mb.classList.remove('active');
  if(recStream){ try{ recStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} recStream=null; }
  recorder=null; recChunks=[];
}

function toggleFullscreen(){

  if(fsElement()){
    var exit=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
    if(exit){ try{ exit.call(document); }catch(e){} }
    el.classList.remove('is-fullscreen');
    return;
  }
  var req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req){

    try{ pr=req.call(el); }catch(e){ pr=null; }
    if(pr&&typeof pr.then==='function'){
      pr.then(function(){ el.classList.add('is-fullscreen'); setTimeout(refreshLayout,100); },
              function(){ enterPseudoFullscreen(); });

function bindMousePan(pw){
  if(!pw||!pw.addEventListener) return;
  var dragging=false, sx=0, sy=0, stx=0, sty=0;
  pw.addEventListener('mousedown', function(e){
    if(!handMode||e.button!==0) return;
    dragging=true; sx=e.clientX; sy=e.clientY; stx=view.tx; sty=view.ty;
    if(e.preventDefault) e.preventDefault();
  }, false);
  document.addEventListener('mousemove', function(e){
    if(!dragging||!handMode) return;
    view.tx=stx+(e.clientX-sx); view.ty=sty+(e.clientY-sy);
    applyManualTransform();
  }, false);
  document.addEventListener('mouseup', function(){ dragging=false; }, false);
  pw.addEventListener('dblclick', function(e){ if(!handMode) return; resetView(); if(e.preventDefault) e.preventDefault(); }, false);
}

function startHost(){
  if(!/^\d{6}$/.test(String(state.roomId||''))) state.roomId=randomRoomId();
  state.isHost=true;
  var peer=new Peer(hostPeerIdForRoom(state.roomId), PEER_OPTS);
  state.peer=peer;
  peer.on('open', function(){ hostRetries=0; state.members.set(peer.id, state.nick); enterRoom(); });
  peer.on('connection', onHostConnection);
  peer.on('error', function(err){
    if(err&&err.type==='unavailable-id'&&hostRetries<10){
      hostRetries++;
      try{ peer.destroy(); }catch(e){}
      var delay=Math.min(3000, 700+hostRetries*400);
      if(hostRetries<=3) toast('房间地址还在释放中，正在重试('+hostRetries+')…');
      setTimeout(startHost, delay);
      return;
    }
    hideLoading();
    setLobbyBusy(false);
    showMsg('连接失败：'+((err&&(err.type||err.message))||'未知错误'), true);
    state.isHost=false;
    if(!state.connected){ clearSession(); showScreen('lobby'); }
  });
  peer.on('disconnected', function(){ try{ peer.reconnect(); }catch(e){} });
}

function startGuestSession(nick, roomId, isReconnect){
  var peer=new Peer(PEER_OPTS);
  state.peer=peer;
  var settled=false;
  var timer=null;
  function clearT(){ if(timer){ clearTimeout(timer); timer=null; } }
  function fail(m){
    if(settled) return;
    settled=true; clearT();
    if(isReconnect) return;
    setLobbyBusy(false); hideLoading();
    showMsg(m, true);
    clearSession();
    try{ peer.destroy(); }catch(e){}
    if(state.peer===peer) state.peer=null;
    showScreen('lobby');
  }
  if(!isReconnect){ timer=setTimeout(function(){ fail('连接超时，请确认房号是否正确'); }, 15000); }
  peer.on('open', function(){
    var conn=peer.connect(hostPeerIdForRoom(roomId), {reliable:true});
    state.hostConn=conn;
    conn.on('open', function(){
      try{ conn.send({type:'hello', nick:nick, identityId:state.identityId}); }catch(e){}
    });
    conn.on('data', function(data){
      if(data&&data.type==='welcome'){
        if(settled) return;
        settled=true; clearT();
        state.url=data.url||'';
        state.shareActive=!!data.shareActive;
        state.shareKind=data.shareKind||'screen';
        state.members=new Map((data.members||[]).map(function(m){ return [m.id,m.nick]; }));
        setLobbyBusy(false); hideLoading();
        if(isReconnect || state.connected){ onReconnected(); }
        else { enterRoom(); }
      }
      handleGuestData(data);
    });
    conn.on('close', function(){ if(state.connected) onHostLost(); });
  });
  peer.on('call', function(call){
    try{ call.answer(); }catch(e){}
    call.on('stream', function(s){ onShareStreamReceived(s); });
    call.on('close', function(){ onShareStreamClosed(); });
    call.on('error', function(){ onShareStreamClosed(); });
  });
  peer.on('error', function(err){
    var t=err&&err.type;
    if(settled){
      if(state.connected && (t==='peer-unavailable'||t==='network'||t==='disconnected')) onHostLost();
      return;
    }
    if(t==='peer-unavailable') fail('房间不存在，或房主已离线');
    else fail('连接失败：'+(t||(err&&err.message)||'未知错误'));
  });
  peer.on('disconnected', function(){ try{ peer.reconnect(); }catch(e){} });
}

function copyText(text, okMsg, failMsg){
  var ok=function(){ toast(okMsg||'已复制'); };
  var bad=function(){ toast(failMsg||('复制失败，请手动复制：'+text)); };
  if(navigator.clipboard&&navigator.clipboard.writeText&&env.isSecure&&!env.isFile){
    try{ navigator.clipboard.writeText(text).then(ok, function(){ legacyCopyRaw(text, ok, bad); }); return; }catch(e){}
  }
  legacyCopyRaw(text, ok, bad);
}
function legacyCopyRaw(text, ok, bad){
  var ta=null, done=false;
  try{
    ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    ta.setAttribute('readonly','');
    document.body.appendChild(ta);
    ta.select();
    try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
    done=document.execCommand('copy');
  }catch(e){ done=false; }
  try{ if(ta&&ta.parentNode) ta.parentNode.removeChild(ta); }catch(e){}
  if(done) ok(); else bad();
}

function autoEnterIfPossible(hashRoom){
  if(state.connected) return;
  var sess=loadSession();

  if(sess && sess.isHost && (!hashRoom || sess.roomId===hashRoom)){
    state.nick=String(sess.nick || localStorage.getItem('tvparty_nick') || '房主').slice(0,12);
    var ni=$('#nickInput'); if(ni) ni.value=state.nick;
    state.roomId=sess.roomId;
    state.isHost=true;
    state.url=sess.url||'';
    state.identityId = sess.identityId || genIdentityId();
    state.rejoined=true;
    hostRetries=0;
    showMsg('正在恢复房间 '+sess.roomId+' …');
    ensurePeerLib(function(ok){
      if(!ok){ showMsg('通信组件加载失败，请检查网络后重试', true); return; }
      startHost();
    });
    return;
  }

  var room = hashRoom || (sess? sess.roomId : '');
  if(!/^\d{6}$/.test(room)) return;
  var nick = String((sess && sess.roomId===room && sess.nick) || localStorage.getItem('tvparty_nick') || '访客').slice(0,12);
  var ni2 = $('#nickInput'); if(ni2) ni2.value = nick;
  state.nick = nick;
  state.roomId = room;
  state.isHost = false;
  state.identityId = (sess && sess.roomId===room && sess.identityId) || genIdentityId();
  showMsg('正在进入房间 '+room+' …');
  ensurePeerLib(function(ok){
    if(!ok){ showMsg('通信组件加载失败，请检查网络后重试', true); return; }
    startGuestSession(nick, room, false);
  });
}

    if(tag==='INPUT'||tag==='TEXTAREA') return;
    if((e.key==='f'||e.key==='F'||e.keyCode===70)&&state.connected){ e.preventDefault(); toggleFullscreen(); }
    if((e.key==='p'||e.key==='P'||e.keyCode===80)&&state.connected){ e.preventDefault(); toggleFloatMode(); }
    if(e.key==='Escape'||e.keyCode===27){
      if(floatState.active){ exitFloatMode(); return; }
      if(handMode) exitHandMode();
      if(pseudoFull) exitPseudoFullscreen();
    }
  }, false);

  var ui=$('#urlInput'), pp=$('#parsePreview');
  if(ui&&pp){
    var onInput=function(){
      var v=ui.value.trim();
      if(!v){ pp.classList.add('hidden'); pp.innerHTML=''; return; }
      renderParsePreview(pp, parseVideoInput(v));
    };
    ui.addEventListener('input', onInput, false);
    ui.addEventListener('paste', function(){ setTimeout(onInput, 0); }, false);
    ui.addEventListener('change', onInput, false);
  }

  updateUIForRole();
  bindEmbedMessageSync();
  var fsEvents=['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'];
  for(var fi=0;fi<fsEvents.length;fi++){
    document.addEventListener(fsEvents[fi], function(){
      var on=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);
      if(mainWrapEl) mainWrapEl.classList.toggle('is-fullscreen', on);
      setTimeout(refreshLayout, 60);
      setTimeout(refreshLayout, 300);
    }, false);
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    renewSession();

    if(state.isHost){
      if(state.peer && state.peer.disconnected){
        try{ state.peer.reconnect(); }catch(e){}
      }
      if(!state.connected && /^\d{6}$/.test(String(state.roomId||''))){
        if(state.peer){ try{ state.peer.destroy(); }catch(e){} state.peer=null; }
        hostRetries = 0;
        startHost();
      }
    } else if(state.connected){
      if(state.hostConn && !state.hostConn.open){
        onHostLost();
      } else if(state.hostConn && state.hostConn.open){
        try{ state.hostConn.send({type:'ping', ts:Date.now()}); }catch(e){ onHostLost(); }
      }
    }
  }, false);

  ensurePeerLib(function(ok){
    if(!ok) showMsg('通信组件加载失败：当前网络可能拦截了 CDN。点「创建房间」会重试。', true);
  });
}

/* ==================== 环境条 ==================== */
function showEnvBar(){
  var bar=$('#envBar'); if(!bar) return;
  var msgs=[];
  if(!env.isSecure){ bar.classList.add('danger'); bar.textContent='⚠️ 当前非 HTTPS 环境，部分浏览器会禁用 WebRTC，聊天可能无法连接'; bar.classList.remove('hidden'); return; }
  if(!env.hasWebRTC){ bar.classList.add('danger'); bar.textContent='⚠️ 当前浏览器不支持 WebRTC，无法与房间内其他人通信'; bar.classList.remove('hidden'); return; }
  if(env.isWechat) msgs.push('微信内置浏览器：如遇连接不稳定，建议点右上角"在浏览器打开"');
  if(!env.canShareScreen&&env.canShareCamera) msgs.push('本浏览器不支持屏幕共享，已自动改用摄像头共享');
  else if(!env.canShareScreen&&!env.canShareCamera) msgs.push('当前环境不支持共享屏幕/摄像头');
  if(!env.hasMediaRecorder) msgs.push('当前环境不支持语音消息');
  if(env.isFile) msgs.push('本地文件方式打开：功能可用，放到 https 上再分享给朋友更稳');
  if(msgs.length>0){ bar.textContent='ℹ️ '+msgs.join('；'); bar.classList.remove('hidden'); setTimeout(function(){ bar.classList.add('hidden'); }, 6500); }
}

/* ==================== 启动 ==================== */
function boot(){
  try{ initUI(); }catch(e){ console.error('initUI failed:', e); }
  try{ bindViewportEvents(); }catch(e){}
  try{ refreshLayout(); }catch(e){}
  try{ showEnvBar(); }catch(e){}
  try{ hideLoading(); }catch(e){}
  setTimeout(function(){ try{ refreshLayout(); }catch(e){} }, 100);
  setTimeout(function(){ try{ refreshLayout(); }catch(e){} }, 400);
  setTimeout(function(){ try{ refreshLayout(); }catch(e){} }, 1000);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot, false);
else boot();

window.addEventListener('beforeunload', function(){ try{ if(state.isHost && state.roomId) saveSession(); }catch(e){} }, false);

})();
</script>
