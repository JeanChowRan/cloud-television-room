<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>一起看 · 观影房</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e2230; --line:#2a2f3d;
    --text:#e8eaed; --muted:#8b93a7; --accent:#4c8bf5; --accent2:#2f6fe0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  .hidden{display:none !important}

  /* ---------- 大厅 ---------- */
  #lobby{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
  .card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
  .card h1{margin:0 0 4px;font-size:24px;letter-spacing:.5px}
  .sub{margin:0 0 6px;color:var(--muted);font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
  input[type=text]{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#11141b;color:var(--text);font-size:15px;outline:none;transition:border-color .15s;
  }
  input[type=text]:focus{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-top:20px;background:#11141b;padding:4px;border-radius:10px}
  .tab{flex:1;padding:9px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;transition:.15s}
  .tab.active{background:var(--panel2);color:var(--text)}
  .pane{margin-top:16px}
  button.primary{
    width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;transition:.15s;
  }
  button.primary:hover:not(:disabled){background:var(--accent2)}
  button.primary:disabled{opacity:.55;cursor:default}
  .hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}
  .status{font-size:13px;color:var(--muted);margin:14px 0 0;min-height:18px;line-height:1.5}
  .status.error{color:#ff6b6b}

  /* ---------- 房间 ---------- */
  #room{height:100vh;height:100dvh;display:flex;flex-direction:column}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .room-id{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .room-id strong{color:var(--text);font-size:16px;letter-spacing:2px;font-variant-numeric:tabular-nums}
  .topbar-right{display:flex;align-items:center;gap:8px}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;transition:.15s}
  .ghost:hover{color:var(--text);border-color:#3a4152}
  .badge{background:var(--panel2);color:var(--muted);font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}

  /* ---------- 主区域（全屏目标，含播放器 + 聊天） ---------- */
  .main{
    flex:1 1 auto;display:flex;flex-direction:column;min-height:0;min-width:0;
    background:#000;
  }
  .main:fullscreen{background:#000}
  .main:-webkit-full-screen{background:#000}

  .player-col{flex:0 0 auto;display:flex;flex-direction:column;min-width:0;min-height:0}

  /* 房主换源栏 */
  .host-bar{
    display:flex;gap:8px;align-items:center;flex:0 0 auto;
    padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--line);
  }
  .host-bar .tag{
    font-size:11px;color:var(--accent);border:1px solid rgba(76,139,245,.45);
    border-radius:6px;padding:2px 6px;flex:0 0 auto;letter-spacing:.5px;
  }
  .host-bar input{
    flex:1 1 auto;min-width:0;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
    background:#11141b;color:var(--text);font-size:13px;outline:none;
  }
  .host-bar input:focus{border-color:var(--accent)}
  .host-bar button{
    flex:0 0 auto;padding:9px 14px;border:0;border-radius:8px;
    background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  }
  .host-bar button:hover{background:var(--accent2)}

  .player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:0 0 auto;overflow:hidden}
  .player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
  .placeholder{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#4d5568;font-size:14px;background:#000;pointer-events:none;
  }

  /* 全屏按钮 */
  .fs-btn{
    position:absolute;top:10px;right:10px;z-index:5;
    width:38px;height:38px;border:0;border-radius:9px;
    background:rgba(15,17,21,.6);color:#fff;font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    opacity:.72;transition:opacity .18s,background .18s;
  }
  .fs-btn:hover{opacity:1;background:rgba(15,17,21,.92)}

  /* ---------- 聊天面板 ---------- */
  .chat{
    flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    background:var(--panel);border-top:1px solid var(--line);
    transition:width .18s ease,height .18s ease,flex-basis .18s ease;
  }

  .chat-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;font-size:12px;color:var(--muted);
    border-bottom:1px solid var(--line);flex:0 0 auto;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .chat-head:hover{color:var(--text)}
  .chat-head-label{letter-spacing:.5px}
  .chat-head-right{display:inline-flex;align-items:center;gap:6px}
  .collapse-icon{font-size:11px;opacity:.8;transition:transform .18s ease}

  .unread-badge{
    background:#ff5c5c;color:#fff;font-size:11px;font-weight:600;
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 0 0 2px var(--panel);
  }

  .messages{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px;
    display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;
  }
  .msg{display:flex;flex-direction:column;align-items:flex-start;max-width:88%;align-self:flex-start}
  .msg.self{align-self:flex-end;align-items:flex-end}
  .msg .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
  .msg .body{
    background:var(--panel2);padding:8px 12px;border-radius:12px;
    font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;
  }
  .msg.self .body{background:var(--accent);color:#fff}
  .sys{align-self:center;font-size:12px;color:var(--muted);text-align:center;max-width:92%;line-height:1.5}

  .chat-input{
    flex:0 0 auto;display:flex;gap:8px;padding:10px;
    padding-bottom:max(10px,env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--panel);
  }
  .chat-input input{
    flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:#11141b;color:var(--text);font-size:16px;outline:none;
  }
  .chat-input input:focus{border-color:var(--accent)}
  .chat-input button{padding:0 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600}
  .chat-input button:disabled{opacity:.5}

  /* ---------- 折叠状态（竖屏：底部一条） ---------- */
  .chat.collapsed{
    flex:0 0 auto;
    height:48px;min-height:48px;max-height:48px;
  }
  .chat.collapsed .messages,
  .chat.collapsed .chat-input{display:none}
  .chat.collapsed .chat-head{
    flex:1 1 auto;border-bottom:0;justify-content:center;padding:0 14px;
  }
  .chat.collapsed .chat-head-label{display:none}
  .chat.collapsed .collapse-icon{transform:rotate(180deg)}

  /* 竖屏时限制视频高度，给聊天留空间 */
  @media (max-aspect-ratio:1/1){
    .player-wrap{max-height:46vh}
  }

  /* ---------- 横屏：右侧聊天 ---------- */
  @media (min-aspect-ratio:1/1) and (min-width:560px){
    .main{flex-direction:row}
    .player-col{flex:1 1 auto;height:100%;min-width:0}
    .player-wrap{flex:1 1 auto;width:100%;height:auto;aspect-ratio:auto;max-height:none}

    .chat{
      width:340px;flex:0 0 340px;border-top:0;border-left:1px solid var(--line);
    }
    /* 横屏折叠：变成右侧窄条 */
    .chat.collapsed{
      width:48px;flex:0 0 48px;
      height:auto;min-height:0;max-height:none;
    }
    .chat.collapsed .chat-head{
      flex-direction:column;gap:8px;padding:14px 0;justify-content:flex-start;
    }
    .chat.collapsed .chat-head-right{flex-direction:column;gap:6px}
    .chat.collapsed .collapse-icon{transform:rotate(90deg)}
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translate(-50%,12px);
    background:rgba(45,51,68,.96);color:#fff;padding:10px 18px;border-radius:10px;
    font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- ===================== 大厅 ===================== -->
<div id="lobby">
  <div class="card">
    <h1>📺 一起看</h1>
    <p class="sub"> 临时观影房 · 无需注册</p>

    <label for="nickInput">你的昵称</label>
    <input id="nickInput" type="text" maxlength="12" placeholder="给自己起个名字" autocomplete="nickname">

    <div class="tabs">
      <button class="tab active" data-tab="create" type="button">创建房间</button>
      <button class="tab" data-tab="join" type="button">加入房间</button>
    </div>

    <div id="createPane" class="pane">
      <label for="urlInput">视频链接</label>
      <input id="urlInput" type="text" placeholder="https://example.com/play/12345">
      <p class="hint">填播放页地址，也可以直接粘贴 <code>&lt;iframe src="…"&gt;</code> 代码。<br>
        注意：部分网站禁止被嵌入（会显示空白），请选用允许 iframe 的地址。</p>
      <button id="createBtn" class="primary" type="button">创建房间</button>
    </div>

    <div id="joinPane" class="pane hidden">
      <label for="roomInput">房间号</label>
      <input id="roomInput" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字">
      <button id="joinBtn" class="primary" type="button">加入房间</button>
    </div>

    <p id="lobbyMsg" class="status"></p>
  </div>
</div>

<!-- ===================== 房间 ===================== -->
<div id="room" class="hidden">
  <header class="topbar">
    <div class="room-id">
      <span>房间</span>
      <strong id="roomIdText">------</strong>
      <button id="copyBtn" class="ghost" type="button">复制</button>
    </div>
    <div class="topbar-right">
      <span id="memberCount" class="badge">1 人</span>
      <button id="leaveBtn" class="ghost" type="button">退出</button>
    </div>
  </header>

  <!-- 全屏目标：包含播放器 + 聊天 -->
  <div class="main" id="mainWrap">
    <!-- 视频列 -->
    <div class="player-col">
      <div id="hostBar" class="host-bar hidden">
        <span class="tag">房主</span>
        <input id="urlEdit" type="text" placeholder="换视频链接，回车同步给所有人…" spellcheck="false">
        <button id="applyUrlBtn" type="button">同步</button>
      </div>

      <div class="player-wrap" id="playerWrap">
        <iframe id="player" title="视频" allowfullscreen
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write"></iframe>
        <div id="playerPlaceholder" class="placeholder">等待视频…</div>
        <button id="fsBtn" class="fs-btn" type="button" title="全屏">⛶</button>
      </div>
    </div>

    <!-- 聊天面板 -->
    <aside class="chat" id="chatPanel">
      <div class="chat-head" id="chatHead" title="点击折叠 / 展开聊天">
        <span class="chat-head-label">聊天</span>
        <span class="chat-head-right">
          <span id="unreadBadge" class="unread-badge" style="display:none">0</span>
          <span class="collapse-icon" id="collapseIcon">▾</span>
        </span>
      </div>
      <div id="messages" class="messages"></div>
      <form id="chatForm" class="chat-input" autocomplete="off">
        <input id="chatInput" type="text" maxlength="500" placeholder="说点什么…">
        <button type="submit">发送</button>
      </form>
    </aside>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';

  /* ============ 配置 ============ */
  var PEER_OPTS = { debug: 1 };
  var PREFIX = 'tvparty-v1-';

  /* ============ 状态 ============ */
  var state = {
    peer: null,
    isHost: false,
    connected: false,
    roomId: '',
    nick: '',
    url: '',
    hostConn: null,
    conns: new Map(),
    members: new Map()
  };

  var hostRetries = 0;
  var unreadCount = 0;

  /* ============ 小工具 ============ */
  function $(s) { return document.querySelector(s); }
  function randomRoomId() { return String(Math.floor(100000 + Math.random() * 900000)); }
  function peerIdForRoom(id) { return PREFIX + id + '-host'; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtTime(ts) {
    var d = new Date(ts || Date.now());
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function showMsg(text, isError) {
    var el = $('#lobbyMsg');
    el.textContent = text || '';
    el.classList.toggle('error', !!isError);
  }
  function setLobbyBusy(busy, text) {
    $('#createBtn').disabled = busy;
    $('#joinBtn').disabled = busy;
    if (text !== undefined) showMsg(text, false);
  }
  function showScreen(name) {
    $('#lobby').classList.toggle('hidden', name !== 'lobby');
    $('#room').classList.toggle('hidden', name !== 'room');
  }
  function toast(text) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 300);
    }, 1600);
  }
  function extractUrl(raw) {
    var m = String(raw).match(/src\s*=\s*["']([^"']+)["']/i);
    return (m ? m[1] : String(raw)).trim();
  }
  function validUrl(url) { return /^https?:\/\//i.test(url); }

  /* ============ 聊天折叠 / 未读 ============ */
  var chatPanelEl = document.getElementById('chatPanel');
  var unreadBadgeEl = document.getElementById('unreadBadge');

  function isChatCollapsed() {
    return chatPanelEl.classList.contains('collapsed');
  }
  function updateUnreadBadge() {
    if (unreadCount > 0) {
      unreadBadgeEl.textContent = unreadCount > 99 ? '99+' : String(unreadCount);
      unreadBadgeEl.style.display = 'inline-flex';
    } else {
      unreadBadgeEl.style.display = 'none';
    }
  }
  function noteUnread() {
    if (!isChatCollapsed()) return;
    unreadCount++;
    updateUnreadBadge();
  }
  function toggleChat() {
    if (isChatCollapsed()) {
      // 展开
      chatPanelEl.classList.remove('collapsed');
      unreadCount = 0;
      updateUnreadBadge();
      requestAnimationFrame(function () {
        var box = document.getElementById('messages');
        box.scrollTop = box.scrollHeight;
      });
    } else {
      // 折叠
      chatPanelEl.classList.add('collapsed');
    }
  }
  document.getElementById('chatHead').addEventListener('click', toggleChat);

  /* ============ 界面：大厅 ============ */
  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      $('#createPane').classList.toggle('hidden', btn.dataset.tab !== 'create');
      $('#joinPane').classList.toggle('hidden', btn.dataset.tab !== 'join');
      showMsg('');
    });
  });

  var savedNick = localStorage.getItem('tvparty_nick');
  if (savedNick) $('#nickInput').value = savedNick;

  var hashRoom = (location.hash.match(/room=(\d{6})/) || [])[1];
  if (hashRoom) {
    document.querySelector('.tab[data-tab="join"]').click();
    $('#roomInput').value = hashRoom;
  }

  $('#createBtn').addEventListener('click', createRoom);
  $('#joinBtn').addEventListener('click', joinRoom);
  $('#urlInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') createRoom(); });
  $('#roomInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') joinRoom(); });

  /* ============ 创建房间 ============ */
  function createRoom() {
    if (typeof Peer === 'undefined') { showMsg('PeerJS 加载失败，请检查网络', true); return; }

    var nick = ($('#nickInput').value.trim() || '房主').slice(0, 12);
    var url = extractUrl($('#urlInput').value);
    if (!url) { showMsg('请填写视频链接', true); return; }
    if (!validUrl(url)) { showMsg('链接需要以 http:// 或 https:// 开头', true); return; }

    localStorage.setItem('tvparty_nick', nick);
    state.nick = nick;
    state.url = url;
    state.isHost = true;
    hostRetries = 0;

    setLobbyBusy(true, '正在创建房间…');
    startHost();
  }

  function startHost() {
    state.roomId = randomRoomId();
    var peer = new Peer(peerIdForRoom(state.roomId), PEER_OPTS);
    state.peer = peer;

    peer.on('open', function () {
      hostRetries = 0;
      state.members.set(peer.id, state.nick);
      enterRoom();
    });

    peer.on('connection', onHostConnection);

    peer.on('error', function (err) {
      if (err && err.type === 'unavailable-id' && hostRetries < 5) {
        hostRetries++;
        try { peer.destroy(); } catch (e) {}
        startHost();
        return;
      }
      setLobbyBusy(false);
      showMsg('连接失败：' + ((err && (err.type || err.message)) || '未知错误'), true);
      state.isHost = false;
    });

    peer.on('disconnected', function () {
      try { peer.reconnect(); } catch (e) {}
    });
  }

  /* ============ 加入房间 ============ */
  function joinRoom() {
    if (typeof Peer === 'undefined') { showMsg('PeerJS 加载失败，请检查网络', true); return; }

    var nick = ($('#nickInput').value.trim() || '访客').slice(0, 12);
    var roomId = $('#roomInput').value.trim();
    if (!/^\d{6}$/.test(roomId)) { showMsg('请输入 6 位数字房间号', true); return; }

    localStorage.setItem('tvparty_nick', nick);
    state.nick = nick;
    state.roomId = roomId;

    setLobbyBusy(true, '正在连接房间 ' + roomId + ' …');

    var peer = new Peer(PEER_OPTS);
    state.peer = peer;
    var settled = false;

    function fail(msg) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      setLobbyBusy(false);
      showMsg(msg, true);
      state.roomId = '';
      try { peer.destroy(); } catch (e) {}
      state.peer = null;
    }

    var timer = setTimeout(function () {
      fail('连接超时，请确认房号是否正确、房主是否在线');
    }, 15000);

    peer.on('open', function () {
      var conn = peer.connect(peerIdForRoom(roomId), { reliable: true });
      state.hostConn = conn;

      conn.on('open', function () {
        conn.send({ type: 'hello', nick: nick });
      });

      conn.on('data', function (data) {
        if (data && data.type === 'welcome') {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          state.url = data.url || '';
          state.members = new Map((data.members || []).map(function (m) { return [m.id, m.nick]; }));
          setLobbyBusy(false);
          enterRoom();
        }
        handleGuestData(data);
      });

      conn.on('close', function () {
        if (state.connected) onHostLost();
      });

      conn.on('error', function () {});
    });

    peer.on('error', function (err) {
      var t = err && err.type;
      if (t === 'peer-unavailable') fail('房间不存在，或房主已离线');
      else fail('连接失败：' + (t || (err && err.message) || '未知错误'));
    });

    peer.on('disconnected', function () {
      try { peer.reconnect(); } catch (e) {}
    });
  }

  /* ============ 进入房间 ============ */
  function enterRoom() {
    state.connected = true;
    showScreen('room');
    $('#roomIdText').textContent = state.roomId;

    if (state.isHost) {
      $('#hostBar').classList.remove('hidden');
      $('#urlEdit').value = state.url;
    } else {
      $('#hostBar').classList.add('hidden');
    }

    if (state.url) setPlayer(state.url);
    renderMembers();

    addSystem(state.isHost
      ? '房间已创建，把房号发给朋友，一起看吧～'
      : '已加入房间');

    if (window.innerWidth > 720) $('#chatInput').focus();
  }

  function setPlayer(url) {
    $('#playerPlaceholder').classList.add('hidden');
    $('#player').src = url;
  }

  /* ============ 房主：连接管理 ============ */
  function onHostConnection(conn) {
    conn.on('open', function () {
      state.conns.set(conn.peer, conn);
    });

    conn.on('data', function (data) { handleHostData(conn, data); });

    conn.on('close', function () {
      var nick = state.members.get(conn.peer);
      state.conns.delete(conn.peer);
      state.members.delete(conn.peer);
      if (nick) {
        addSystem(nick + ' 离开了房间');
        broadcast({ type: 'system', text: nick + ' 离开了房间' });
      }
      broadcast({ type: 'members', members: memberList() });
      renderMembers();
    });

    conn.on('error', function () {});
  }

  function handleHostData(conn, data) {
    if (!data || typeof data !== 'object') return;

    if (data.type === 'hello') {
      var nick = String(data.nick || '匿名').slice(0, 12);
      state.members.set(conn.peer, nick);

      safeSend(conn, {
        type: 'welcome',
        url: state.url,
        roomId: state.roomId,
        hostNick: state.nick,
        members: memberList()
      });

      addSystem(nick + ' 加入了房间');
      broadcast({ type: 'system', text: nick + ' 加入了房间' }, conn.peer);
      broadcast({ type: 'members', members: memberList() });
      renderMembers();
      return;
    }

    if (data.type === 'chat') {
      var senderNick = state.members.get(conn.peer) || '匿名';
      var text = String(data.text == null ? '' : data.text).slice(0, 500).trim();
      if (!text) return;
      var ts = Date.now();
      addChat(senderNick, text, ts, false);
      broadcast({ type: 'chat', nick: senderNick, text: text, ts: ts }, conn.peer);
      return;
    }
  }

  /* ============ 访客：接收房主消息 ============ */
  function handleGuestData(data) {
    if (!data || typeof data !== 'object') return;

    if (data.type === 'chat') {
      addChat(data.nick || '匿名', String(data.text || ''), data.ts, false);

    } else if (data.type === 'system') {
      addSystem(String(data.text || ''));

    } else if (data.type === 'members' && Array.isArray(data.members)) {
      state.members = new Map(data.members.map(function (m) { return [m.id, m.nick]; }));
      renderMembers();

    } else if (data.type === 'url') {
      var u = String(data.url || '');
      if (u && u !== state.url) {
        state.url = u;
        setPlayer(u);
        addSystem('房主切换了视频');
      }
    }
  }

  function onHostLost() {
    addSystem('⚠️ 与房主的连接已断开');
    $('#chatInput').disabled = true;
    $('#chatForm').querySelector('button').disabled = true;
  }

  /* ============ 广播 / 发送 ============ */
  function broadcast(msg, exceptPeerId) {
    state.conns.forEach(function (conn, id) {
      if (id === exceptPeerId) return;
      safeSend(conn, msg);
    });
  }
  function safeSend(conn, msg) {
    if (!conn || !conn.open) return;
    try { conn.send(msg); } catch (e) {}
  }
  function memberList() {
    var out = [];
    state.members.forEach(function (nick, id) { out.push({ id: id, nick: nick }); });
    return out;
  }

  /* ============ 房主：切换视频源并同步 ============ */
  function applyUrlChange() {
    if (!state.isHost) return;
    var url = extractUrl($('#urlEdit').value);
    if (!url) { toast('请填写视频链接'); return; }
    if (!validUrl(url)) { toast('链接需以 http:// 或 https:// 开头'); return; }
    if (url === state.url) { toast('链接没有变化'); return; }

    state.url = url;
    $('#urlEdit').value = url;
    setPlayer(url);

    broadcast({ type: 'url', url: url, by: state.nick });

    addSystem('已切换视频源');
    toast('已同步给房间内所有人');
  }

  $('#applyUrlBtn').addEventListener('click', applyUrlChange);
  $('#urlEdit').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); applyUrlChange(); }
  });

  /* ============ 全屏（作用于 mainWrap，含播放器 + 聊天） ============ */
  var mainWrap = document.getElementById('mainWrap');
  var fsBtn = document.getElementById('fsBtn');

  var supportsFs = !!(mainWrap.requestFullscreen ||
                      mainWrap.webkitRequestFullscreen ||
                      mainWrap.msRequestFullscreen);
  if (!supportsFs) fsBtn.classList.add('hidden');

  function fullscreenEl() {
    return document.fullscreenElement ||
           document.webkitFullscreenElement ||
           document.msFullscreenElement ||
           null;
  }

  function updateFsBtn() {
    var isFs = fullscreenEl() === mainWrap;
    fsBtn.textContent = isFs ? '⤡' : '⛶';
    fsBtn.title = isFs ? '退出全屏' : '全屏';
  }

  function toggleFullscreen() {
    if (!supportsFs) { toast('当前浏览器不支持全屏'); return; }

    if (fullscreenEl()) {
      var exit = document.exitFullscreen ||
                 document.webkitExitFullscreen ||
                 document.msExitFullscreen;
      if (exit) { try { exit.call(document); } catch (e) {} }
      return;
    }

    var req = mainWrap.requestFullscreen ||
              mainWrap.webkitRequestFullscreen ||
              mainWrap.msRequestFullscreen;
    if (!req) { toast('当前浏览器不支持全屏'); return; }

    try {
      var p = req.call(mainWrap);
      if (p && typeof p.catch === 'function') {
        p.catch(function () { toast('无法进入全屏'); });
      }
    } catch (e) {
      toast('无法进入全屏');
    }
  }

  fsBtn.addEventListener('click', toggleFullscreen);

  ['fullscreenchange', 'webkitfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
    document.addEventListener(ev, updateFsBtn);
  });

  // F 键全屏（输入框里不触发）
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if ((e.key === 'f' || e.key === 'F') && state.connected) {
      e.preventDefault();
      toggleFullscreen();
    }
  });

  /* ============ 聊天 UI ============ */
  $('#chatForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('#chatInput');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';

    var ts = Date.now();
    addChat(state.nick, text, ts, true);

    if (state.isHost) {
      broadcast({ type: 'chat', nick: state.nick, text: text, ts: ts });
    } else if (state.hostConn && state.hostConn.open) {
      safeSend(state.hostConn, { type: 'chat', text: text });
    } else {
      addSystem('未连接到房主，消息未发送');
    }
  });

  function appendNode(node) {
    var box = $('#messages');
    var stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
    box.appendChild(node);
    if (stick) box.scrollTop = box.scrollHeight;
  }

  function addChat(nick, text, ts, self) {
    var el = document.createElement('div');
    el.className = 'msg' + (self ? ' self' : '');

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = nick + ' · ' + fmtTime(ts);

    var body = document.createElement('div');
    body.className = 'body';
    body.textContent = text;

    el.appendChild(meta);
    el.appendChild(body);
    appendNode(el);

    if (!self) noteUnread();
  }

  function addSystem(text) {
    var el = document.createElement('div');
    el.className = 'sys';
    el.textContent = text;
    appendNode(el);
    noteUnread();
  }

  function renderMembers() {
    $('#memberCount').textContent = state.members.size + ' 人';
  }

  /* ============ 顶栏操作 ============ */
  $('#copyBtn').addEventListener('click', function () {
    var text = state.roomId;
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('房间号已复制：' + text); }
      catch (e) { toast('复制失败，请手动记录：' + text); }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { toast('房间号已复制：' + text); })
        .catch(fallback);
    } else {
      fallback();
    }
  });

  $('#leaveBtn').addEventListener('click', function () {
    var tip = state.isHost
      ? '你是房主，退出后房间会关闭，确定吗？'
      : '确定要退出房间吗？';
    if (!confirm(tip)) return;
    teardown();
    showScreen('lobby');
    showMsg('');
  });

  /* ============ 清理 ============ */
  function teardown() {
    state.connected = false;

    if (fullscreenEl()) {
      var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (exit) { try { exit.call(document); } catch (e) {} }
    }

    if (state.hostConn) {
      try { state.hostConn.close(); } catch (e) {}
      state.hostConn = null;
    }
    state.conns.forEach(function (c) { try { c.close(); } catch (e) {} });
    state.conns.clear();
    state.members.clear();

    if (state.peer) {
      try { state.peer.destroy(); } catch (e) {}
      state.peer = null;
    }

    state.isHost = false;
    state.url = '';
    state.roomId = '';

    var iframe = $('#player');
    iframe.src = 'about:blank';
    $('#playerPlaceholder').classList.remove('hidden');
    $('#messages').innerHTML = '';
    $('#chatInput').disabled = false;
    $('#chatForm').querySelector('button').disabled = false;
    $('#roomIdText').textContent = '------';
    $('#hostBar').classList.add('hidden');
    $('#urlEdit').value = '';
    renderMembers();

    // 重置聊天折叠 / 未读
    chatPanelEl.classList.remove('collapsed');
    unreadCount = 0;
    updateUnreadBadge();
    updateFsBtn();
  }

  window.addEventListener('pagehide', function () {
    try { if (state.peer) state.peer.destroy(); } catch (e) {}
  });

})();
</script>
</body>
</html>
