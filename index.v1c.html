}
function startHost(){
  state.roomId=randomRoomId();
  var peer=new Peer(hostPeerIdForRoom(state.roomId), PEER_OPTS);
  state.peer=peer;
  peer.on('open', function(){
    hostRetries=0;
    state.members.set(peer.id, state.nick);
    enterRoom();
  });
  peer.on('connection', onHostConnection);
  peer.on('error', function(err){
    if(err&&err.type==='unavailable-id'&&hostRetries<5){
      hostRetries++;
      try{ peer.destroy(); }catch(e){}
      startHost();
      return;
    }
    setLobbyBusy(false);
    showMsg('连接失败：'+((err&&(err.type||err.message))||'未知错误'), true);
    state.isHost=false;
  });
  peer.on('disconnected', function(){ try{ peer.reconnect(); }catch(e){} });
}
function joinRoom(){ withPeerLib(joinRoomNow); }
function joinRoomNow(){
  if(typeof Peer==='undefined'){ showMsg('通信组件未就绪，请稍后重试', true); return; }
  if(!env.hasWebRTC){ showMsg('浏览器不支持 WebRTC', true); return; }
  var ni=$('#nickInput');
  var nick=((ni&&ni.value.trim())||'访客').slice(0,12);
  var ri=$('#roomInput');
  var roomId=ri?ri.value.trim():'';
  if(!/^\d{6}$/.test(roomId)){ showMsg('请输入 6 位数字房间号', true); return; }
  resetRuntimeState();
  localStorage.setItem('tvparty_nick', nick);
  state.nick=nick;
  state.roomId=roomId;
  state.isHost=false;
  setLobbyBusy(true, '正在连接房间 '+roomId+' …');
  var peer=new Peer(PEER_OPTS);
  state.peer=peer;
  var settled=false;
  function fail(m){
    if(settled) return;
    settled=true;
    clearTimeout(timer);
    setLobbyBusy(false);
    showMsg(m, true);
    try{ peer.destroy(); }catch(e){}
    state.peer=null;
  }
  var timer=setTimeout(function(){ fail('连接超时，请确认房号是否正确'); }, 15000);
  peer.on('open', function(){
    var conn=peer.connect(hostPeerIdForRoom(roomId), {reliable:true});
    state.hostConn=conn;
    peer.on('call', function(call){
      try{ call.answer(); }catch(e){}
      call.on('stream', function(s){ onShareStreamReceived(s); });
      call.on('close', function(){ onShareStreamClosed(); });
      call.on('error', function(){ onShareStreamClosed(); });
    });
    conn.on('open', function(){ conn.send({type:'hello', nick:nick}); });
    conn.on('data', function(data){
      if(data&&data.type==='welcome'){
        if(settled) return;
        settled=true;
        clearTimeout(timer);
        state.url=data.url||'';
        state.shareActive=!!data.shareActive;
        state.shareKind=data.shareKind||'screen';
        state.members=new Map((data.members||[]).map(function(m){ return [m.id,m.nick]; }));
        setLobbyBusy(false);
        enterRoom();
      }
      handleGuestData(data);
    });
    conn.on('close', function(){ if(state.connected) onHostLost(); });
    conn.on('error', function(){});
  });
  peer.on('error', function(err){
    var t=err&&err.type;
    if(t==='peer-unavailable') fail('房间不存在，或房主已离线');
    else fail('连接失败：'+(t||(err&&err.message)||'未知错误'));
  });
  peer.on('disconnected', function(){ try{ peer.reconnect(); }catch(e){} });
}
function enterRoom(){
  state.connected=true;
  showScreen('room');
  var rt=$('#roomIdText'); if(rt) rt.textContent=state.roomId;
  updateUIForRole();
  if(chatPanelEl) chatPanelEl.classList.remove('collapsed');
  unreadCount=0;
  updateUnreadBadge();
  resetView();
  if(state.url) setPlayer(state.url);
  else if(pendingInitialUrl){ state.url=pendingInitialUrl; setPlayer(pendingInitialUrl); }
  pendingInitialUrl='';
  syncUrlHash();
  if(state.isHost) startIframePoll();
  renderMembers();
  addSystem(state.isHost?'房间已创建，把房号发给朋友，一起看吧～':'已加入房间，你是访客');
  startHeartbeat();
  setTimeout(refreshLayout, 30);
  setTimeout(refreshLayout, 200);
  var ci=$('#chatInput');
  if(ci&&window.innerWidth>720) ci.focus();
}
function resetRuntimeState(){
  state.connected=false;
  state.hostConn=null;
  state.conns.forEach(function(c){ try{c.close();}catch(e){} });
  state.conns.clear();
  state.members.clear();
  if(state.shareStream){
    try{ state.shareStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    state.shareStream=null;
  }
  state.mediaCalls.forEach(function(c){ try{c.close();}catch(e){} });
  state.mediaCalls.clear();
  state.shareActive=false;
  state.remoteStream=null;
  state.viewMode='local';
  state.shareKind='screen';
  state.shareFacing='user';
  pendingInitialUrl='';
  lastAutoUrl='';
  stopIframePoll();
  if(state.peer){ try{ state.peer.destroy(); }catch(e){} state.peer=null; }
  state.roomId='';
  state.url='';
  unreadCount=0;
  if(unreadBadgeEl) updateUnreadBadge();
  if(chatPanelEl) chatPanelEl.classList.remove('collapsed');
  pendingMedia.clear();
  sendQueue.length=0;
  sendProcessing=false;
  stopHeartbeat();
  allMessages=[];
  displayedCount=CHAT_INITIAL;
  chatAutoStick=true;
  pendingChoice=null;
  iframeReady=false;
  resetView();
  hideLoading();
}
function applyUrlChange(){
  if(!state.isHost) return;
  var input=$('#urlEdit');
  var raw=input?input.value.trim():'';
  if(!raw){ toast('请输入链接'); return; }
  var parsed=parseVideoInput(raw);
  if(parsed.error){ toast('解析失败：'+parsed.error); return; }

  if(parsed.source === 'b23-pending'){
    toast('正在展开 B站短链…');
    resolveB23Url(parsed.b23Url, function(err, bv){
      if(err || !bv){ toast('b23.tv 短链展开失败，请手动打开复制完整地址'); return; }
      var finalUrl = 'https://player.bilibili.com/player.html?bvid='+bv+'&page=1&high_quality=1&danmaku=0&autoplay=0';
      doApplyUrl(finalUrl);
    });
    return;
  }
  doApplyUrl(parsed.url);
}
function doApplyUrl(url){
  if(url===state.url){ toast('链接没有变化'); return; }
  state.url=url;
  var input=$('#urlEdit'); if(input) input.value=url;
  setPlayer(url);
  syncUrlHash();
  broadcast({type:'url', url:url, by:state.nick});
  addSystem('已切换视频源');
  toast('已同步给房间内所有人');
}
function copyText(text, okMsg, failMsg){
  var ok=function(){ toast(okMsg||'已复制'); };
  var bad=function(){ toast(failMsg||('复制失败，请手动复制：'+text)); };
  if(navigator.clipboard&&navigator.clipboard.writeText&&env.isSecure&&!env.isFile){
    try{ navigator.clipboard.writeText(text).then(ok, function(){ legacyCopyRaw(text, ok, bad); }); return; }catch(e){}
  }
  legacyCopyRaw(text, ok, bad);
}
function legacyCopyRaw(text, ok, bad){
  var ta=null, done=false;
  try{
    ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    ta.setAttribute('readonly','');
    document.body.appendChild(ta);
    ta.select();
    try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
    done=document.execCommand('copy');
  }catch(e){ done=false; }
  try{ if(ta&&ta.parentNode) ta.parentNode.removeChild(ta); }catch(e){}
  if(done) ok(); else bad();
}
function copyRoomId(){
  var text=state.roomId||'';
  var link='';
  try{ link=buildInviteLink(); }catch(e){}
  if(env.isFile||!/^https?:\/\//i.test(link)){
    /* 本机文件方式打开：链接只在你这台电脑有效，发房间号更靠谱 */
    copyText(text, '房间号已复制：'+text+'（本地文件打开时，请把房间号发给朋友）', '复制失败，请手动记录房间号：'+text);
    return;
  }
  copyText(link, '邀请链接已复制，发给朋友即可直接进房：'+link, '复制失败，请手动复制这段链接：'+link);
}

/* ==================== 清理 ==================== */
function teardown(){
  state.connected=false;
  exitHandMode();
  stopRecording(false);
  if(state.shareStream){
    try{ state.shareStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    state.shareStream=null;
  }
  state.mediaCalls.forEach(function(c){ try{c.close();}catch(e){} });
  state.mediaCalls.clear();
  if(state.hostConn){ try{ state.hostConn.close(); }catch(e){} state.hostConn=null; }
  state.conns.forEach(function(c){ try{c.close();}catch(e){} });
  state.conns.clear();
  if(state.peer){ try{ state.peer.destroy(); }catch(e){} state.peer=null; }
  state.isHost=false;
  state.url='';
  state.roomId='';
  state.shareKind='screen';
  pendingInitialUrl='';
  lastAutoUrl='';
  stopIframePoll();
  clearUrlHash();
  var ifr=$('#player'); if(ifr) ifr.src='about:blank';
  var box=getMessagesEl(); if(box) box.innerHTML='';
  allMessages=[];
  displayedCount=CHAT_INITIAL;
  pendingChoice=null;
  stopHeartbeat();
  resetView();
  var ci=$('#chatInput'); if(ci) ci.disabled=false;
}

/* ==================== 初始化 ==================== */
function initUI(){
  chatPanelEl=$('#chatPanel');
  unreadBadgeEl=$('#unreadBadge');
  viewLayer=$('#viewLayer');
  viewportLayer=$('#viewportLayer');
  playerOuterEl=$('#playerOuter');
  mainWrapEl=$('#mainWrap');
  zoomLabel=$('#zoomLabel');

  safeBind('#chatHead', 'click', toggleChat);
  safeBind('#lightboxClose', 'click', closeLightbox);
  safeBind('#lightbox', 'click', function(e){ if(e.target&&e.target.id==='lightbox') closeLightbox(); });

  try{
    var tabs=document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      (function(btn){
        btn.addEventListener('click', function(){
          var allTabs=document.querySelectorAll('.tab');
          for(var j=0;j<allTabs.length;j++) allTabs[j].classList.toggle('active', allTabs[j]===btn);
          var cp=$('#createPane'), jp=$('#joinPane');
          if(cp) cp.classList.toggle('hidden', btn.getAttribute('data-tab')!=='create');
          if(jp) jp.classList.toggle('hidden', btn.getAttribute('data-tab')!=='join');
          showMsg('');
        }, false);
      })(tabs[i]);
    }
  }catch(e){}

  var savedNick=localStorage.getItem('tvparty_nick');
  var ni=$('#nickInput'); if(savedNick&&ni) ni.value=savedNick;
  var hp=hashParams();
  var hashRoom=String(hp.room||'').trim();
  if(/^\d{6}$/.test(hashRoom)){
    var joinTab=document.querySelector('.tab[data-tab="join"]');
    if(joinTab) joinTab.click();
    var ri=$('#roomInput'); if(ri) ri.value=hashRoom;
    var hv=hp.v||'';
    if(hv){
      var pv=parseVideoInput(hv);
      if(!pv.error&&pv.url) pendingInitialUrl=pv.url;
    }
    /* 分享链接：自动进房；进来后如果房主还没给链接，就先播链接里带的视频 */
    setTimeout(function(){
      if(state.connected) return;
      var jb=$('#joinBtn'); if(jb&&jb.disabled) return;
      joinRoom();
    }, 400);
  }

  safeBind('#createBtn', 'click', createRoom);
  safeBind('#joinBtn', 'click', joinRoom);
  safeBind('#roomInput', 'keydown', function(e){ if(e.key==='Enter'||e.keyCode===13) joinRoom(); });

  safeBind('#zoomInBtn', 'click', function(){ zoomBy(1.2); });
  safeBind('#zoomOutBtn', 'click', function(){ zoomBy(1/1.2); });
  safeBind('#resetViewBtn', 'click', resetView);
  safeBind('#handModeBtn', 'click', toggleHandMode);
  safeBind('#fsBtn', 'click', toggleFullscreen);

  safeBind('#applyUrlBtn', 'click', applyUrlChange);
  safeBind('#copyUrlBtn', 'click', function(){
    var u=state.url;
    if(!u){ toast('暂无链接'); return; }
    copyText(u, '链接已复制', '复制失败，请手动复制：'+u);
  });
  /* 访客：向房主重新要一次当前链接（顺带刷新自己的播放页） */
  safeBind('#pullUrlBtn', 'click', function(){
    if(state.isHost){ trySyncFromIframe(false); toast('已尝试读取页面地址'); return; }
    if(!state.hostConn||!state.hostConn.open){ toast('还没连上房主'); return; }
    safeSend(state.hostConn, {type:'url-request'});
    toast('已向房主请求当前链接…');
  });
  safeBind('#camSwitchBtn', 'click', switchCameraFacing);
  safeBind('#shareFsBtn', 'click', shareVideoFullscreen);

  safeBind('#shareBtn', 'click', startShare);
  safeBind('#shareBackBtn', 'click', function(){ switchToLocalView(true); });
  safeBind('#shareUnmuteBtn', 'click', function(){
    var v=document.getElementById('shareVideo');
    if(v){
      v.muted=false;
      try{ v.volume=1; }catch(e){}
      safeVideoPlay(v, function(){}, function(){});
      var ub=$('#shareUnmuteBtn'); if(ub) ub.classList.add('hidden');
    }
  });
  safeBind('#sharePlayBtn', 'click', function(){
    var v=document.getElementById('shareVideo');
    if(v){
      safeVideoPlay(v, function(){
        var po=$('#sharePlayOverlay'); if(po) po.classList.add('hidden');
        var ub=$('#shareUnmuteBtn'); if(ub) ub.classList.remove('hidden');
      }, function(){});
    }
  });

  safeBind('#emojiBtn', 'click', function(e){ e.preventDefault(); toggleEmojiPanel(); });
  safeBind('#imgBtn', 'click', function(e){ e.preventDefault(); var f=$('#imgFile'); if(f) f.click(); });
  safeBind('#imgFile', 'change', onImagePicked);
  if(env.hasMediaRecorder){
    var mb=$('#micBtn');
    if(mb){
      mb.classList.remove('hidden');
      mb.addEventListener('click', function(e){ e.preventDefault(); startRecording(); }, false);
    }
  }
  safeBind('#recStop', 'click', function(){ stopRecording(true); });
  safeBind('#recCancel', 'click', function(){ stopRecording(false); });
  buildEmojiPanel();

  safeBind('#copyBtn', 'click', copyRoomId);
  safeBind('#leaveBtn', 'click', function(){
    var tip=state.isHost?'你是房主，退出后房间会关闭，确定吗？':'确定要退出房间吗？';
    if(!window.confirm(tip)) return;
    teardown();
    showScreen('lobby');
    showMsg('');
  });

  safeBind('#chatForm', 'submit', function(e){ e.preventDefault(); sendChat(); return false; });
  bindMessagesScroll();
  bindUrlViewClick();

  var pw=$('#playerWrap');
  if(pw){
    var passiveOpt=false;
    try{
      var opts=Object.defineProperty({}, 'passive', { get: function(){ passiveOpt={passive:false}; return false; } });
      window.addEventListener('test', null, opts);
      window.removeEventListener('test', null, opts);
    }catch(e){ passiveOpt=false; }
    pw.addEventListener('touchstart', onTouchStart, passiveOpt||false);
    pw.addEventListener('touchmove', onTouchMove, passiveOpt||false);
    pw.addEventListener('touchend', onTouchEnd, false);
    pw.addEventListener('touchcancel', onTouchEnd, false);
    pw.addEventListener('wheel', function(e){
      if(!handMode) return;
      e.preventDefault();
      zoomBy(e.deltaY>0?0.9:1.1);
    }, passiveOpt||false);
    bindMousePan(pw);   /* 电脑上也能按住拖动微调 */
  }

  var ifr=$('#player');
  if(ifr){
    ifr.addEventListener('load', function(){
      setTimeout(refreshLayout, 60);
      setTimeout(refreshLayout, 400);
      if(!iframeReady){ iframeReady=true; return; }
      /* 同源/被允许时读 iframe 内部地址；跨域读不到就静默跳过 */
      trySyncFromIframe(false);
    }, false);
  }

  document.addEventListener('keydown', function(e){
    var tag=(e.target&&e.target.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    if((e.key==='f'||e.key==='F'||e.keyCode===70)&&state.connected){
      e.preventDefault();
      toggleFullscreen();
    }
    if(e.key==='Escape'||e.keyCode===27){
      if(handMode) exitHandMode();
      if(pseudoFull) exitPseudoFullscreen();
    }
  }, false);

  var ui=$('#urlInput'), pp=$('#parsePreview');
  if(ui&&pp){
    var onInput=function(){
      var v=ui.value.trim();
      if(!v){ pp.classList.add('hidden'); pp.innerHTML=''; return; }
      renderParsePreview(pp, parseVideoInput(v));
    };
    ui.addEventListener('input', onInput, false);
    ui.addEventListener('paste', function(){ setTimeout(onInput, 0); }, false);
    ui.addEventListener('change', onInput, false);
  }

  updateUIForRole();
  bindEmbedMessageSync();
  var fsEvents=['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'];
  for(var fi=0;fi<fsEvents.length;fi++){
    document.addEventListener(fsEvents[fi], function(){
      var on=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement);
      if(mainWrapEl) mainWrapEl.classList.toggle('is-fullscreen', on);
      setTimeout(refreshLayout, 60);
      setTimeout(refreshLayout, 300);
    }, false);
  }
  /* 通信组件（PeerJS）后台自动加载，多源重试，不阻塞界面 */
  ensurePeerLib(function(ok){
    if(!ok) showMsg('通信组件加载失败：当前网络可能拦截了 CDN。点「创建房间」会重试。', true);
  });
}

/* ==================== 环境条 ==================== */
function showEnvBar(){
  var bar=$('#envBar');
  if(!bar) return;
  var msgs=[];
  if(!env.isSecure){
    bar.classList.add('danger');
    bar.textContent='⚠️ 当前非 HTTPS 环境，部分浏览器会禁用 WebRTC，聊天可能无法连接';
    bar.classList.remove('hidden');
    return;
  }
  if(!env.hasWebRTC){
    bar.classList.add('danger');
    bar.textContent='⚠️ 当前浏览器不支持 WebRTC，无法与房间内其他人通信';
    bar.classList.remove('hidden');
    return;
  }
  if(env.isWechat) msgs.push('微信内置浏览器：如遇连接不稳定，建议点右上角"在浏览器打开"');
  if(!env.canShareScreen&&env.canShareCamera) msgs.push('本浏览器不支持屏幕共享，已自动改用摄像头共享');
  else if(!env.canShareScreen&&!env.canShareCamera) msgs.push('当前环境不支持共享屏幕/摄像头');
  if(!env.hasMediaRecorder) msgs.push('当前环境不支持语音消息');
  if(env.isFile) msgs.push('本地文件方式打开：功能可用，放到 https 上再分享给朋友更稳');
  if(msgs.length>0){
    bar.textContent='ℹ️ '+msgs.join('；');
    bar.classList.remove('hidden');
    setTimeout(function(){ bar.classList.add('hidden'); }, 6500);
  }
}

/* ==================== 启动 ==================== */
function boot(){
  try{ initUI(); }catch(e){ console.error('initUI failed:', e); }
  try{ bindViewportEvents(); }catch(e){}
  try{ refreshLayout(); }catch(e){}
  try{ showEnvBar(); }catch(e){}
  setTimeout(function(){ try{ refreshLayout(); }catch(e){} }, 100);
  setTimeout(function(){ try{ refreshLayout(); }catch(e){} }, 400);
  setTimeout(function(){ try{ refreshLayout(); }catch(e){} }, 1000);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot, false);
else boot();

window.addEventListener('pagehide', function(){
  try{ if(state.peer) state.peer.destroy(); }catch(e){}
}, false);
window.addEventListener('beforeunload', function(){
  try{ if(state.peer) state.peer.destroy(); }catch(e){}
}, false);

})();
</script>
